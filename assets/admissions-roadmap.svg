<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 650"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Your U.S. dental school pathway</title>
  <desc id="desc">
    A general six-stage planning roadmap: credentials, exams, English
    proficiency, application, bench test and interview, then program and
    licensure. Requirements and sequence vary by program and state.
  </desc>
  <rect width="1440" height="650" fill="#193f35" />
  <g font-family="Arial,sans-serif">
    <text x="65" y="66" fill="#c1d0a8" font-size="13" letter-spacing="3">
      TRAIN DENTIST / YOUR NEXT CHAPTER
    </text>
    <text
      x="65"
      y="139"
      fill="#fffdf4"
      font-size="53"
      font-family="Georgia,serif"
    >
      A clearer path to a U.S. DDS or DMD.
    </text>
    <text x="65" y="184" fill="#c5d1c7" font-size="18">
      One milestone at a time. Personal guidance along the way.
    </text>
    <path d="M86 290h1260" stroke="#607e6e" stroke-width="2" />
    <circle cx="88" cy="290" r="23" fill="#193f35" stroke="#789482" />
    <text x="88" y="296" text-anchor="middle" fill="#dce7be" font-size="15">
      01
    </text>
    <text x="65" y="372" fill="#fffdf4" font-size="19" font-weight="bold">
      Credentials
    </text>
    <text x="65" y="407" fill="#c5d1c7" font-size="15">
      Review degree evaluations
    </text>
    <text x="65" y="432" fill="#c5d1c7" font-size="15">
      and document requirements.
    </text>
    <circle cx="310" cy="290" r="23" fill="#193f35" stroke="#789482" />
    <text x="310" y="296" text-anchor="middle" fill="#dce7be" font-size="15">
      02
    </text>
    <text x="287" y="372" fill="#fffdf4" font-size="19" font-weight="bold">
      Exams
    </text>
    <text x="287" y="407" fill="#c5d1c7" font-size="15">
      Plan for the INBDE and
    </text>
    <text x="287" y="432" fill="#c5d1c7" font-size="15">
      required examinations.
    </text>
    <circle cx="532" cy="290" r="23" fill="#193f35" stroke="#789482" />
    <text x="532" y="296" text-anchor="middle" fill="#dce7be" font-size="15">
      03
    </text>
    <text x="509" y="372" fill="#fffdf4" font-size="19" font-weight="bold">
      English proficiency
    </text>
    <text x="509" y="407" fill="#c5d1c7" font-size="15">
      Check accepted tests
    </text>
    <text x="509" y="432" fill="#c5d1c7" font-size="15">
      and required scores.
    </text>
    <circle cx="754" cy="290" r="23" fill="#193f35" stroke="#789482" />
    <text x="754" y="296" text-anchor="middle" fill="#dce7be" font-size="15">
      04
    </text>
    <text x="731" y="372" fill="#fffdf4" font-size="19" font-weight="bold">
      Application
    </text>
    <text x="731" y="407" fill="#c5d1c7" font-size="15">
      Prepare CAAPID and
    </text>
    <text x="731" y="432" fill="#c5d1c7" font-size="15">
      school supplements.
    </text>
    <rect x="936" y="241" width="215" height="267" rx="13" fill="#dce7be" />
    <circle cx="976" cy="290" r="23" fill="#193f35" stroke="#789482" />
    <text x="976" y="296" text-anchor="middle" fill="#dce7be" font-size="15">
      05
    </text>
    <text x="953" y="337" fill="#193f35" font-size="10" letter-spacing="1.2">
      OUR CORE FOCUS
    </text>
    <text x="953" y="372" fill="#193f35" font-size="19" font-weight="bold">
      Bench &amp; interview
    </text>
    <text x="953" y="407" fill="#385445" font-size="15">
      Refine your skills.
    </text>
    <text x="953" y="432" fill="#385445" font-size="15">Tell your story.</text>
    <circle cx="1198" cy="290" r="23" fill="#193f35" stroke="#789482" />
    <text x="1198" y="296" text-anchor="middle" fill="#dce7be" font-size="15">
      06
    </text>
    <text x="1175" y="372" fill="#fffdf4" font-size="19" font-weight="bold">
      Program &amp; licensure
    </text>
    <text x="1175" y="407" fill="#c5d1c7" font-size="15">
      Complete your degree and
    </text>
    <text x="1175" y="432" fill="#c5d1c7" font-size="15">
      state licensing requirements.
    </text>
    <path d="M65 550h1310" stroke="#4d6c5c" />
    <text x="65" y="589" fill="#c5d1c7" font-size="14">
      A general planning guide. Requirements and sequence vary by program and
      state. Coaching does not guarantee admission.
    </text>
    <text x="65" y="622" fill="#c1d0a8" font-size="14">
      traindentist.com · Mentorship by Dr. Liji Mathew, DMD
    </text>
  </g>
</svg>
